name: Build & Release APK with Native llama.cpp

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Имя тега / версии (например, v1.2.0)'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK with NDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Clone llama.cpp Pinned Release (b3925)
        run: |
          mkdir -p app/src/main/cpp
          if [ ! -d "app/src/main/cpp/llama.cpp" ]; then
            echo "Cloning llama.cpp tag b3925 (commit 0e41b300ed28f7fe185d938b2e3d56a0bf7411ed)..."
            git clone --depth 1 --branch b3925 https://github.com/ggerganov/llama.cpp.git app/src/main/cpp/llama.cpp
          fi
          echo "Verifying llama.cpp source presence:"
          ls -la app/src/main/cpp/llama.cpp/CMakeLists.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK & CMake
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Enable externalNativeBuild in build.gradle.kts
        run: |
          # Inject externalNativeBuild block into app/build.gradle.kts
          python3 -c '
          with open("app/build.gradle.kts", "r") as f:
              content = f.read()

          native_block = """
  defaultConfig {
    ndk {
      abiFilters.add("arm64-v8a")
    }
    externalNativeBuild {
      cmake {
        cppFlags("-O3 -DNDEBUG -flto -march=armv8-a+fp+simd")
        arguments("-DANDROID_STL=c++_shared", "-DLLAMA_STANDALONE=OFF", "-DLLAMA_BUILD_COMMON=OFF", "-DLLAMA_BUILD_TESTS=OFF", "-DLLAMA_BUILD_EXAMPLES=OFF", "-DLLAMA_BUILD_SERVER=OFF")
      }
    }
  }

  externalNativeBuild {
    cmake {
      path = file("src/main/cpp/CMakeLists.txt")
      version = "3.22.1"
    }
  }
          """
          if "externalNativeBuild" not in content:
              content = content.replace("defaultConfig {", native_block, 1)
              with open("app/build.gradle.kts", "w") as f:
                  f.write(content)
              print("externalNativeBuild injected successfully into build.gradle.kts")
          '

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "Keystore successfully decoded from GitHub Secrets"
          else
            echo "No KEYSTORE_BASE64 secret found, creating release keystore fallback"
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=VoiceAI, OU=AI, O=Local, L=City, S=State, C=US"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          chmod +x gradlew || true
          gradle :app:assembleRelease --no-daemon

      - name: Verify arm64-v8a Native Library in APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK at $APK_PATH"
          echo "Inspecting .so libraries inside APK:"
          unzip -l "$APK_PATH" | grep -E "libllama|libggml" || true
          
          cp "$APK_PATH" VoiceAI-release.apk
          SHA256=$(sha256sum VoiceAI-release.apk | awk '{print $1}')
          echo "$SHA256" > VoiceAI-release.apk.sha256
          echo "APK_SHA256=$SHA256" >> $GITHUB_ENV
          echo "Release APK SHA-256: $SHA256"

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Voice AI ${{ steps.release_tag.outputs.tag }} (Native arm64-v8a)"
          body: |
            ## Персональный локальный голосовой ИИ для Android (Infinix Note 30)

            ### Содержимое релиза:
            - **Настоящий движок llama.cpp**: релизный тег `b3925` (`0e41b300ed28f7fe185d938b2e3d56a0bf7411ed`) скомпилирован под `arm64-v8a` с NEON/FP16 SIMD.
            - **JNI-библиотеки**: внутри APK упакованы `libllama-android.so`, `libllama.so`, `libggml.so`.
            - **Полноценная локальная генерация**: потоковый callback, корректная склейка UTF-8 (русский язык и эмодзи), разбиение промпта по батчам, отмена генерации.
            - **Безопасное управление памятью**: синхронизация сессий без гонок и обращений к уничтоженным мьютексам.
            - **Поддержка моделей**: Qwen2.5 1.5B Instruct Q4_K_M и Qwen2.5 0.5B Instruct Q4_K_M с верификацией точного SHA-256.

            **Контрольная сумма APK (SHA-256):**
            `${{ env.APK_SHA256 }}`
          files: |
            VoiceAI-release.apk
            VoiceAI-release.apk.sha256
          draft: false
          prerelease: false
